# Magic Mount Configuration File
module_dir=/data/adb/modules
mount_source=KSU
log_file=/data/adb/magic_mount/mm.log
debug=true

# Do NOT register mounts for KSU umount. On OP15/ReSukiSU the global umount
# breaks some modules; SUSFS (hide_sus_mnts) hides the mounts from apps instead,
# so modules stay functional and no global kernel_umount is needed.
umount=false

# Custom bind mounts are read from /data/adb/magic_mount/custom (one per line):
#   bind <source> <target>
# A missing target is created as a new file. Example:
#   bind /data/adb/modules/kernelnosu/system/bin/su /system/bin/su
# The kernelnosu module (if installed) is auto-mounted this way - no config needed.
